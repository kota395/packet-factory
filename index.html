<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f14" />
    <meta name="description" content="データセンターを育てるインクリメンタルゲーム" />
    <title>packet-factory</title>
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <div class="stats">
          <div class="stat"><span class="k">資金</span><span class="v" id="s-money">$0</span></div>
          <div class="stat"><span class="k">収支</span><span class="v" id="s-income">-</span></div>
          <div class="stat"><span class="k">ユーザー</span><span class="v" id="s-users">0</span></div>
          <div class="stat"><span class="k">流量</span><span class="v" id="s-rps">0</span></div>
          <div class="stat"><span class="k">エラー</span><span class="v" id="s-err">-</span></div>
          <div class="stat"><span class="k">p99</span><span class="v" id="s-p99">-</span></div>
        </div>
        <div class="controls">
          <div class="speed" role="group" aria-label="速度">
            <button type="button" data-speed="0" aria-label="一時停止">❚❚</button>
            <button type="button" data-speed="1" aria-label="等速">▶</button>
            <button type="button" data-speed="2" aria-label="2倍速">▶▶</button>
            <button type="button" data-speed="4" aria-label="4倍速">▶▶▶</button>
          </div>
          <div class="menu">
            <button type="button" id="btn-chart">グラフ</button>
            <button type="button" id="btn-save">セーブ</button>
          </div>
        </div>
      </header>

      <section id="chart-panel" hidden><div id="chart"></div></section>

      <main id="board">
        <div id="zoom" role="group" aria-label="表示">
          <button type="button" id="btn-zoom-in" aria-label="拡大">＋</button>
          <button type="button" id="btn-zoom-out" aria-label="縮小">−</button>
          <button type="button" id="btn-fit" aria-label="ノード全体を表示" title="ノード全体を表示">⤢</button>
        </div>
        <aside id="info" hidden></aside>
        <section id="invest" hidden aria-label="投資">
          <header>
            <h2>投資</h2>
            <span id="invest-money"></span>
            <button type="button" id="invest-close" aria-label="閉じる">✕</button>
          </header>
          <div id="invest-stage"></div>
          <div id="invest-tabs" role="tablist" aria-label="系統"></div>
          <div id="invest-list"></div>
        </section>
        <div id="toast" role="status" aria-live="polite"></div>
      </main>

      <p id="hint"></p>
      <nav id="toolbar" aria-label="ツール"></nav>
    </div>

    <div id="modal" hidden><div class="modal-card" id="modal-card"></div></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
